program: src/wandb_entrypoint.py
method: grid
metric:
  name: eval_bpc
  goal: minimize
parameters:
  task:          {value: text_text8}
  diffusion:     {value: mdlm}
  optimizer:     {value: muon}
  n_layer:       {value: 4}
  n_head:        {value: 4}
  d_model:       {value: 128}
  block_size:    {value: 256}
  batch_size:    {value: 64}
  max_iters:     {value: 1500}
  schedule:      {value: wsd}
  mdlm_eps:      {value: 1e-3}
  dropout:       {value: 0.0}
  eps:           {value: 1e-8}
  ns_steps:      {value: 5}
  seed:          {value: 0}
  weight_decay:  {values: [0, 0.1, 0.5]}
  grad_clip:     {values: [0, 0.5, 1.0]}
  warmup_iters:  {values: [100, 500]}
  lr:            {values: [1e-3, 3e-3, 1e-2, 3e-2]}
  momentum:      {values: [0.9, 0.95]}
