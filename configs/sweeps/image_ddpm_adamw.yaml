program: src/wandb_entrypoint.py
method: grid
metric:
  name: eval_loss
  goal: minimize
parameters:
  task:          {value: image_cifar10}
  diffusion:     {value: ddpm}
  optimizer:     {value: adamw}
  model:         {value: unet2d}
  num_diffusion_steps: {value: 1000}
  beta_schedule: {value: linear}
  batch_size:    {value: 64}
  max_iters:     {value: 3000}
  schedule:      {value: wsd}
  warmup_iters:  {value: 200}
  grad_clip:     {value: 0}
  fid_samples:   {value: 0}
  eval_interval: {value: 1000}
  eval_batches:  {value: 4}
  dropout:       {value: 0.0}
  eps:           {value: 1e-8}
  seed:          {value: 0}
  # Tuned dims
  weight_decay:  {values: [0, 0.01, 0.1]}
  lr:            {values: [3e-5, 1e-4, 3e-4, 1e-3]}
  betas_pair:    {values: [[0.9, 0.95], [0.9, 0.999], [0.95, 0.99]]}
