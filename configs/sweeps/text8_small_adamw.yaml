program: src/wandb_entrypoint.py
method: grid
metric:
  name: eval_bpc
  goal: minimize
parameters:
  # fixed task / model
  task:          {value: text_text8}
  diffusion:     {value: mdlm}
  optimizer:     {value: adamw}
  n_layer:       {value: 4}
  n_head:        {value: 4}
  d_model:       {value: 128}
  block_size:    {value: 256}
  batch_size:    {value: 64}
  max_iters:     {value: 1500}
  schedule:      {value: wsd}
  mdlm_eps:      {value: 1e-3}
  dropout:       {value: 0.0}
  eps:           {value: 1e-8}
  seed:          {value: 0}
  # tuned dims (common)
  weight_decay:  {values: [0, 0.1, 0.5]}
  grad_clip:     {values: [0, 0.5, 1.0]}
  warmup_iters:  {values: [100, 500]}
  # tuned dims (AdamW-specific)
  lr:            {values: [1e-4, 3e-4, 1e-3, 3e-3]}
  betas_pair:    {values: [[0.9, 0.95], [0.9, 0.999], [0.95, 0.99]]}
