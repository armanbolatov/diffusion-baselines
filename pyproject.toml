[project]
name = "diffusion-baselines"
version = "0.1.0"
description = "Optimizer benchmark across diffusion tasks (image DDPM, discrete MDLM)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.27",
    "transformers>=4.40",
    "datasets>=2.20",
    "einops>=0.8",
    "tqdm>=4.66",
    "tiktoken>=0.7",
    "prodigyopt>=1.0",
    "schedulefree>=1.4",
    "lion-pytorch>=0.2",
    "pytorch-optimizer>=3.0",
    "matplotlib>=3.8",
    "wandb>=0.17",
    "torchmetrics>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
